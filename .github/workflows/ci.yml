name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  source-guard:
    name: Source guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure generated frontend build is not tracked
        shell: bash
        run: |
          if git ls-files 'internal/infrastructure/frontend/build/**' | grep -q .; then
            echo "Generated frontend build artifacts must not be tracked."
            git ls-files 'internal/infrastructure/frontend/build/**'
            exit 1
          fi

      - name: Enforce source shape
        shell: bash
        run: |
          node <<'JS'
          const fs = require("fs")
          const path = require("path")
          const roots = ["cmd", "internal", "web/src"]
          const violations = []
          const forbidden = /@ts-nocheck|ts-ignore|ts-expect-error|jsx as|jsxs as|Fragment as/

          function walk(dir) {
            if (!fs.existsSync(dir)) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                if (entry.name === "node_modules" || file.includes(path.join("internal", "infrastructure", "frontend", "build"))) continue
                walk(file)
                continue
              }
              if (!/\.(go|ts|tsx)$/.test(entry.name)) continue
              const source = fs.readFileSync(file, "utf8")
              const lines = source.split("\n").length
              if (lines > 200) violations.push(`${file}: ${lines} lines`)
              if (forbidden.test(source)) violations.push(`${file}: forbidden directive or bundled source pattern`)
            }
          }
          roots.forEach(walk)
          if (violations.length) {
            console.error(violations.join("\n"))
            process.exit(1)
          }
          JS

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: source-guard
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: source-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate embedded frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Targeted tests
        run: go test ./internal/domain/stream/... ./internal/domain/video/... ./internal/domain/auth/... ./internal/domain/notification/... ./internal/infrastructure/server/...

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    needs: source-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate embedded frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
