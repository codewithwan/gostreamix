name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  source-guard:
    name: Source guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure generated frontend build is not tracked
        shell: bash
        run: |
          if git ls-files 'internal/infrastructure/frontend/build/**' | grep -q .; then
            echo "Generated frontend build artifacts must not be tracked."
            git ls-files 'internal/infrastructure/frontend/build/**'
            exit 1
          fi

      - name: Enforce source shape
        shell: bash
        run: |
          node <<'JS'
          const fs = require("fs")
          const path = require("path")
          const roots = ["cmd", "internal", "web/src"]
          const violations = []
          const forbidden = /@ts-nocheck|ts-ignore|ts-expect-error|jsx as|jsxs as|Fragment as/

          function walk(dir) {
            if (!fs.existsSync(dir)) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                if (entry.name === "node_modules" || file.includes(path.join("internal", "infrastructure", "frontend", "build"))) continue
                walk(file)
                continue
              }
              if (!/\.(go|ts|tsx)$/.test(entry.name)) continue
              const source = fs.readFileSync(file, "utf8")
              const lines = source.split("\n").length
              if (lines > 300) violations.push(`${file}: ${lines} lines`)
              if (forbidden.test(source)) violations.push(`${file}: forbidden directive or bundled source pattern`)
            }
          }
          roots.forEach(walk)
          if (violations.length) {
            console.error(violations.join("\n"))
            process.exit(1)
          }
          JS

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: source-guard
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: source-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate embedded frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./cmd/... ./internal/...

  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Production)
        id: meta-prod
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-prod.outputs.tags }}
          labels: ${{ steps.meta-prod.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (Development)
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-dev
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Development image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dev
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    needs: source-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate embedded frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
